# ============================================================
# PROFIL : prod  (production)
# Aucun secret, aucun mot de passe, aucune URL reelle.
# Toutes les valeurs sensibles viennent de variables d'environnement.
#
# Variables d'environnement attendues :
#   DB_URL        - URL JDBC de la base de production
#   DB_USERNAME   - utilisateur de la base
#   DB_PASSWORD   - mot de passe de la base
#   JWT_SECRET    - cle de signature JWT (securite)
#   CORS_ALLOWED_ORIGINS - origines autorisees pour le frontend (liste, virgule)
#
# Exemple de lancement :
#   SPRING_PROFILES_ACTIVE=prod DB_URL=... DB_USERNAME=... DB_PASSWORD=... java -jar cms-backend.jar
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  # ----------------------------------------------------------
  # Datasource - via variables d'environnement uniquement
  # Aucun secret ne doit apparaitre dans ce fichier.
  # ----------------------------------------------------------
  datasource:
    # URL construite à partir des variables fournies par Render
    # (ou URL JDBC complète via DB_URL si fournie).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ----------------------------------------------------------
  # JPA / Hibernate - parametres de production
  # ----------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ----------------------------------------------------------
  # Flyway - migrations appliquees au demarrage en production
  # ----------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

# ----------------------------------------------------------
# CORS - origines du frontend React via environnement uniquement
# ----------------------------------------------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# ----------------------------------------------------------
# Serveur
# ----------------------------------------------------------
server:
  # Render impose la variable PORT en production ; 8091 par défaut en local.
  port: ${PORT:8091}

# ----------------------------------------------------------
# Journalisation
# ----------------------------------------------------------
logging:
  level:
    root: WARN
    com.cms: INFO
