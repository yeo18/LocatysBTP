# ============================================================
# LocatysBTP - Blueprint Render
# Déploie 2 ressources : API backend (Docker) + frontend SPA.
# La base de données est hébergée sur Neon (postgresql.autos / neon.tech).
#
# Connexion : Render Dashboard -> New -> Blueprint -> sélectionner le repo
# ============================================================

services:
  # ------------------- API BACKEND (Spring Boot, Docker) -------------------
  - type: web
    name: locatysbtp-backend
    runtime: docker
    repo: https://github.com/yeo18/LocatysBTP
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Secret JWT : à remplacer par une valeur longue et aléatoire
      - key: JWT_SECRET
        sync: false
      # Base PostgreSQL (Neon) : URL JDBC de la base Neon (ex. Neon console ->
      # Connection Details -> JDBC). Doit ressembler à :
      #   jdbc:postgresql://ep-xxxx-xxxx.aws-region.neon.tech/locatysbtp?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Optionnel : clé API OpenWeather pour le module d'analyse météo
      - key: OPENWEATHER_API_KEY
        sync: false
      # Origine autorisée : URL du frontend (ex. https://locatysbtp-frontend.onrender.com)
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ------------------- FRONTEND (SPA React, statique) -------------------
  - type: web
    name: locatysbtp-frontend
    runtime: static
    repo: https://github.com/yeo18/LocatysBTP
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # URL du backend (ex. https://locatysbtp-backend.onrender.com)
      - key: VITE_API_URL
        sync: false