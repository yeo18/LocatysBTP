# ============================================================
# LocatysBTP - Blueprint Render (Infrastructure as Code)
# Déploie 3 ressources : base PostgreSQL, backend API, frontend SPA
#
# Connexion : Render Dashboard -> New -> Blueprint -> sélectionner le repo
# ============================================================

databases:
  - name: locatysbtp-db
    plan: free
    databaseName: locatysbtp
    user: locatysbtp

services:
  # ------------------- API BACKEND (Spring Boot, Docker) -------------------
  - type: web
    name: locatysbtp-backend
    runtime: docker
    repo: https://github.com/yeo18/LocatysBTP
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Ne jamais committer un secret en dur : généré automatiquement par Render
      - key: JWT_SECRET
        generateValue: true
      # Connexion base de données : liée automatiquement à locatysbtp-db
      - key: DB_HOST
        fromDatabase:
          name: locatysbtp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: locatysbtp-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: locatysbtp-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: locatysbtp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: locatysbtp-db
          property: password
      # À renseigner MANUELLEMENT après création du frontend (voir README)
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ------------------- FRONTEND (SPA React, statique) -------------------
  - type: web
    name: locatysbtp-frontend
    runtime: static
    repo: https://github.com/yeo18/LocatysBTP
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # À renseigner MANUELLEMENT après création du backend (voir README)
      - key: VITE_API_URL
        sync: false